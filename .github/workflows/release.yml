name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*-rc*'
      - 'v*-beta.*'
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v6.3.0; leave blank to use the pushed tag'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, test, and create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Compute tag, version, prerelease flag
        id: compute
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [ -z "$tag" ]; then
            echo "No tag input and github.ref_name is empty" >&2
            exit 1
          fi
          version="${tag#v}"
          # Prerelease iff the version contains a hyphen (e.g. 6.3.0-rc.1)
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.compute.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-playwright-browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install playwright browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run emulator tests
        run: xvfb-run npm run test_emulator

      - name: Verify tag matches package.json version
        env:
          TAG_VERSION: ${{ steps.compute.outputs.version }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          # Tag may have a prerelease suffix (e.g. 6.3.0-rc.1); base must match package version
          tag_base="${TAG_VERSION%%-*}"
          if [ "$pkg_version" != "$tag_base" ]; then
            echo "Tag version ($TAG_VERSION, base=$tag_base) does not match package.json version ($pkg_version)" >&2
            echo "Bump package.json + manifest.json + package-lock.json to match the tag before releasing." >&2
            exit 1
          fi

      - name: Build extension and store zips
        run: npm run archive

      - name: Build source zip
        run: npm run archive:source

      - name: Stage release artifacts
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          mkdir -p release-artifacts
          # The build/archive scripts name zips from dist/version, which is the
          # manifest version with dots->dashes and no prerelease suffix (e.g.
          # 6.3.0 -> "6-3-0"). The release/tag VERSION may differ (e.g.
          # "6.3.0-rc.1"), so read the produced names from dist/version and copy
          # them to the tag-versioned dest names that the GH Release `files:` and
          # the publish jobs reference.
          ARTIFACT_VERSION="$(cat dist/version)"
          cp "dist/chrome/aesr-chrome-${ARTIFACT_VERSION}.zip"   "release-artifacts/aesr-chrome-${VERSION}.zip"
          cp "dist/firefox/aesr-firefox-${ARTIFACT_VERSION}.zip" "release-artifacts/aesr-firefox-${VERSION}.zip"
          # Edge accepts the Chrome MV3 zip as-is; an explicit edge-named artifact
          # makes the GH Release inventory self-documenting and gives the edge
          # publish job a stable filename to reference.
          cp "dist/chrome/aesr-chrome-${ARTIFACT_VERSION}.zip"   "release-artifacts/aesr-edge-${VERSION}.zip"
          cp "dist/aesr-source-${ARTIFACT_VERSION}.zip"          "release-artifacts/aesr-source-${VERSION}.zip"
          ls -la release-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-zips-${{ steps.compute.outputs.tag }}
          path: release-artifacts/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.compute.outputs.tag }}
          name: ${{ steps.compute.outputs.tag }}
          prerelease: ${{ steps.compute.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/aesr-chrome-${{ steps.compute.outputs.version }}.zip
            release-artifacts/aesr-firefox-${{ steps.compute.outputs.version }}.zip
            release-artifacts/aesr-edge-${{ steps.compute.outputs.version }}.zip
            release-artifacts/aesr-source-${{ steps.compute.outputs.version }}.zip

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build-and-release
    if: needs.build-and-release.outputs.prerelease != 'true' && vars.CHROME_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify CHROME_PUBLISH_KEYS secret is set
        env:
          CHROME_PUBLISH_KEYS: ${{ secrets.CHROME_PUBLISH_KEYS }}
        run: |
          if [ -z "$CHROME_PUBLISH_KEYS" ]; then
            echo "vars.CHROME_EXTENSION_ID is set but secrets.CHROME_PUBLISH_KEYS is empty." >&2
            echo "Configure the secret or unset the var to skip Chrome publishing." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-zips-${{ needs.build-and-release.outputs.tag }}
          path: release-artifacts

      - name: Publish to Chrome Web Store
        # Chrome Web Store API v1.1 (classic). Self-contained curl so we depend on
        # no third-party publish action. NOTE: the v1.1 API is supported only until
        # 2026-10-15 — before then, migrate to the v2 API (chromewebstore.googleapis.com)
        # which additionally requires a publisher id.
        env:
          CHROME_PUBLISH_KEYS: ${{ secrets.CHROME_PUBLISH_KEYS }}
          EXT_ID: ${{ vars.CHROME_EXTENSION_ID }}
          ZIP: release-artifacts/aesr-chrome-${{ needs.build-and-release.outputs.version }}.zip
        run: |
          set -euo pipefail
          client_id=$(jq -r '.clientId // empty' <<<"$CHROME_PUBLISH_KEYS")
          client_secret=$(jq -r '.clientSecret // empty' <<<"$CHROME_PUBLISH_KEYS")
          refresh_token=$(jq -r '.refreshToken // empty' <<<"$CHROME_PUBLISH_KEYS")
          if [ -z "$client_id" ] || [ -z "$client_secret" ] || [ -z "$refresh_token" ]; then
            echo "CHROME_PUBLISH_KEYS must be JSON { \"clientId\", \"clientSecret\", \"refreshToken\" }." >&2
            exit 1
          fi
          if [ -z "$EXT_ID" ]; then echo "CHROME_EXTENSION_ID is empty." >&2; exit 1; fi
          echo "::add-mask::$client_secret"
          echo "::add-mask::$refresh_token"
          echo "Refreshing Chrome Web Store access token..."
          access_token=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${client_id}" \
            --data-urlencode "client_secret=${client_secret}" \
            --data-urlencode "refresh_token=${refresh_token}" \
            --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty')
          if [ -z "$access_token" ]; then echo "Failed to obtain Chrome access token." >&2; exit 1; fi
          echo "::add-mask::$access_token"
          echo "Uploading ${ZIP} to item ${EXT_ID}..."
          upload=$(curl -sS -X PUT -T "$ZIP" \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXT_ID}")
          echo "Upload response: $upload"
          if [ "$(jq -r '.uploadState // empty' <<<"$upload")" != "SUCCESS" ]; then
            echo "Chrome upload did not reach uploadState=SUCCESS." >&2
            exit 1
          fi
          echo "Publishing item ${EXT_ID}..."
          publish=$(curl -sS -X POST -H "Content-Length: 0" \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXT_ID}/publish")
          echo "Publish response: $publish"
          if ! jq -e '.status | index("OK")' <<<"$publish" >/dev/null; then
            echo "Chrome publish did not return status OK." >&2
            exit 1
          fi
          echo "Chrome Web Store: update submitted for review."

  publish-firefox:
    name: Sign Firefox add-on (unlisted self-distribution)
    needs: build-and-release
    if: needs.build-and-release.outputs.prerelease != 'true' && vars.FIREFOX_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify Firefox AMO JWT secrets are set
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ]; then
            echo "vars.FIREFOX_EXTENSION_ID is set but secrets.FIREFOX_JWT_ISSUER and/or secrets.FIREFOX_JWT_SECRET are empty." >&2
            echo "Configure both secrets or unset the var to skip Firefox signing." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-zips-${{ needs.build-and-release.outputs.tag }}
          path: release-artifacts

      - name: Unpack Firefox build
        run: mkdir -p firefox-unpacked && unzip -q "release-artifacts/aesr-firefox-${{ needs.build-and-release.outputs.version }}.zip" -d firefox-unpacked

      - name: Sign add-on (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: npx --yes web-ext sign --channel=unlisted --source-dir=firefox-unpacked --artifacts-dir="$RUNNER_TEMP/signed-firefox"

      - name: Attach signed .xpi to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.build-and-release.outputs.tag }}" "$RUNNER_TEMP"/signed-firefox/*.xpi --clobber --repo "${{ github.repository }}"

  publish-edge:
    name: Publish to Edge Add-ons
    needs: build-and-release
    if: needs.build-and-release.outputs.prerelease != 'true' && vars.EDGE_PRODUCT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify EDGE_PUBLISH_KEYS secret is set
        env:
          EDGE_PUBLISH_KEYS: ${{ secrets.EDGE_PUBLISH_KEYS }}
        run: |
          if [ -z "$EDGE_PUBLISH_KEYS" ]; then
            echo "vars.EDGE_PRODUCT_ID is set but secrets.EDGE_PUBLISH_KEYS is empty." >&2
            echo "Configure the secret or unset the var to skip Edge publishing." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-zips-${{ needs.build-and-release.outputs.tag }}
          path: release-artifacts

      # NOTE: This Edge path is UNTESTED — it has never run (EDGE_PRODUCT_ID is unset).
      # The Edge Add-ons API v1.1 uses API-key auth, so EDGE_PUBLISH_KEYS must be JSON
      # { "apiKey": "...", "clientId": "..." } (NOT the old clientSecret/accessTokenUrl
      # OAuth shape). Verify on the first real release after wiring EDGE_PRODUCT_ID.
      - name: Extract Edge credentials
        id: edge-creds
        env:
          EDGE_PUBLISH_KEYS: ${{ secrets.EDGE_PUBLISH_KEYS }}
        run: |
          set -euo pipefail
          api_key=$(jq -r '.apiKey // empty' <<<"$EDGE_PUBLISH_KEYS")
          client_id=$(jq -r '.clientId // empty' <<<"$EDGE_PUBLISH_KEYS")
          if [ -z "$api_key" ] || [ -z "$client_id" ]; then
            echo "EDGE_PUBLISH_KEYS must be JSON { \"apiKey\", \"clientId\" } for the Edge Add-ons API v1.1." >&2
            exit 1
          fi
          echo "::add-mask::$api_key"
          echo "::add-mask::$client_id"
          {
            echo "api_key=$api_key"
            echo "client_id=$client_id"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ vars.EDGE_PRODUCT_ID }}
          zip-path: release-artifacts/aesr-edge-${{ needs.build-and-release.outputs.version }}.zip
          api-key: ${{ steps.edge-creds.outputs.api_key }}
          client-id: ${{ steps.edge-creds.outputs.client_id }}
